    const sidebar = document.getElementById('sidebar');
    const content = document.getElementById('content');
    let idx = 0;

    function renderSidebar(){
      sidebar.innerHTML = '';
      scenes.forEach((s, i)=>{
        const el = document.createElement('div');
        el.className = 'scene-item';
        el.id = 'scene-'+i;
        el.innerHTML = `<div class='scene-title'>${i+1}. ${s.title}</div><div class='scene-sub'>${s.keyPoints.slice(0,2).join(' • ')}</div>`;
        el.onclick = ()=>go(i);
        sidebar.appendChild(el);
      });
    }

    function renderContent(){
      const s = scenes[idx];
      content.innerHTML = '';
      const title = document.createElement('h2'); title.textContent = (idx+1)+'. '+s.title; content.appendChild(title);

      if(s.audioFile){
        const box = document.createElement('div'); box.className='audio-box';
        box.innerHTML = `<audio controls src='narrations/${s.audioFile.split('/').pop()}'></audio>`;
        content.appendChild(box);
      }

      if(s.keyPoints && s.keyPoints.length){
        const ul = document.createElement('ul'); ul.className='points';
        s.keyPoints.forEach(p=>{ const li = document.createElement('li'); li.textContent = p; ul.appendChild(li); });
        content.appendChild(ul);
      }

      if(s.narration){
        const p = document.createElement('p'); p.textContent = s.narration; content.appendChild(p);
      }

      updateActive();
    }

    function updateActive(){
      document.querySelectorAll('.scene-item').forEach((el, i)=>{
        el.classList.toggle('active', i===idx);
      });
      document.getElementById('prevBtn').disabled = idx===0;
      document.getElementById('nextBtn').disabled = idx===scenes.length-1;
    }

    function go(i){ idx=i; renderContent(); document.querySelector('#scene-'+i).scrollIntoView({block:'nearest'}); }
    function prev(){ if(idx>0){ idx--; renderContent(); }}
    function next(){ if(idx<scenes.length-1){ idx++; renderContent(); }}

    // init
    renderSidebar(); renderContent();
