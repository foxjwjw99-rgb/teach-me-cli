<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teach-me-cli 課程生成系統的原理與架構</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; line-height: 1.6; }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    
    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    
    .header h1 {
      font-size: 42px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header p {
      font-size: 16px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .header .meta {
      font-size: 13px;
      color: #999;
    }
    
    .content {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .sidebar {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      overflow: hidden;
      max-height: 75vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    
    .slide-item {
      padding: 14px 16px;
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: all 0.25s;
      font-size: 13px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .slide-item:hover {
      background: #f8f9ff;
    }
    
    .slide-item.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-left-color: white;
    }
    
    .slide-item-num {
      opacity: 0.7;
      font-size: 11px;
      font-weight: 500;
    }
    
    .slide-item-title {
      font-weight: 500;
      margin-top: 4px;
      line-height: 1.4;
    }
    
    .main {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 50px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .slide {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }
    
    .slide.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .slide h2 {
      font-size: 38px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 28px;
      line-height: 1.2;
    }
    
    .audio-player {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border: 2px solid #667eea;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .audio-player audio {
      flex: 1;
      max-width: 100%;
    }
    
    .audio-status {
      font-size: 12px;
      color: #667eea;
      font-weight: 500;
      min-width: 80px;
    }
    
    .slide-points {
      list-style: none;
      margin: 20px 0;
    }
    
    .slide-points li {
      padding: 12px 0;
      padding-left: 32px;
      position: relative;
      font-size: 16px;
      color: #333;
      line-height: 1.6;
    }
    
    .slide-points li:before {
      content: "▸";
      position: absolute;
      left: 0;
      color: #667eea;
      font-weight: bold;
      font-size: 24px;
      line-height: 1;
    }
    
    .slide-narration {
      margin-top: 24px;
      padding: 20px 24px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
      border-left: 4px solid #667eea;
      border-radius: 6px;
      font-style: italic;
      color: #555;
      line-height: 1.7;
      font-size: 15px;
    }
    
    .controls {
      margin-top: 40px;
      display: flex;
      gap: 16px;
      justify-content: center;
      padding-top: 30px;
      border-top: 1px solid #f0f0f0;
    }
    
    .btn {
      padding: 12px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.25s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .slide-counter {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 14px;
      font-weight: 500;
    }
    
    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
    }
    
    .progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      margin-top: 20px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎓 teach-me-cli 課程生成系統的原理與架構</h1>
      <p>用 AI 和自動化把任何主題變成完整課程</p>
      <div class="meta">由 teach-me-cli v2.0 自動生成 • 由 🦊 狐狸 為 Jimmy 精心製作</div>
    </div>
    
    <div class="content">
      <div class="sidebar">
        <div id="slideList"></div>
      </div>
      
      <div class="main">
        <div id="slides"></div>
        <div class="controls">
          <button class="btn" id="prevBtn" onclick="previousSlide()">← 上一頁</button>
          <button class="btn" id="nextBtn" onclick="nextSlide()">下一頁 →</button>
        </div>
        <div class="slide-counter" id="slideCounter"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <p>🎓 13 個場景 | ⏱️ 39 分鐘課程 | 🎙️ 狐狸配音 | 📚 完整課程結構 | 🚀 OpenClaw 集成</p>
    </div>
  </div>
  
  <script>
    const scenes = [
      {

        title: "歡迎來到課程生成的世界",
        keyPoints: [

          "teach-me-cli 一鍵生成專業課程",

        narration: "大家好！歡迎來到 teach-me-cli 課程生成系統介紹。你是否曾為製作課程而頭疼？寫大綱、設計幻燈片、錄音... 往往要花上好幾天。但只需一個命令就能自動完成？這就是 teach-me-cli 的魔力！",
        audioFile: "narrations/scene_001_narration.wav"
      },
      {
        id: "scene_002",
        title: "問題：傳統課程製作的瓶頸",
        keyPoints: [
          "需要懂教學設計、內容寫作、視覺設計",
          "每個步驟都需要專門工具和技能",

        ],
        narration: "想像你是一位老師。想為學生製作微積分課程。首先寫大綱、組織知識點、製作 PowerPoint、選圖片、配語音... 每個環節都很耗時。如果內容有誤，整個流程要重新來過。",
        audioFile: "narrations/scene_002_narration.wav"
      },
      {
        id: "scene_003",
        title: "解決方案：4 階段魔術",
        keyPoints: [
          "Stage 1️⃣: 大綱生成 — AI 自動結構化",
          "Stage 2️⃣: 內容生成 — 每個場景詳細說明",
          "Stage 3️⃣: 動作生成 — 白板、特效、旁白",
          "Stage 4️⃣: 音檔生成 — OmniVoice 自動配音"
        ],
        narration: "teach-me-cli 用四個階段把這一切自動化。第一階段：AI 生成大綱。第二階段：生成詳細內容。第三階段：生成講師動作。第四階段：自動配音。完整課程誕生！",
        audioFile: "narrations/scene_003_narration.wav"
      },
      {
        id: "scene_004",
        title: "Stage 1: 大綱生成 — AI 當課程設計師",
        keyPoints: [
          "你提供主題和內容",
          "Claude / GPT / Gemini AI 分析",
          "自動生成 12-20 個場景",
          "每個場景有標題、要點、類型"
        ],
        narration: "首先是大綱生成。你給 teach-me-cli 主題，AI 會讀懂內容，自動生成 12 到 20 個場景。每個場景包括標題、要點、類型（講座或測驗）。整個過程只要 15 到 30 秒。",
        audioFile: "narrations/scene_004_narration.wav"
      },
      {
        id: "scene_005",
        title: "Stage 2: 內容生成 — 為每個場景補充血肉",
        keyPoints: [
          "每個場景生成詳細旁白（150-250 字）",
          "自動編寫易於理解的說明",
          "支援 Markdown、LaTeX 公式",
          "並行生成，提高效率"
        ],
        narration: "第二階段是內容生成。AI 為每個場景生成詳細內容，包括教師要念的旁白、幻燈片文字。旁白是口語化的，像真人在講。這一階段大約 30 到 60 秒。",
        audioFile: "narrations/scene_005_narration.wav"
      },
      {
        id: "scene_006",
        title: "Stage 3: 動作生成 — 白板、特效、聚光燈",
        keyPoints: [
          "生成 28+ 種講師動作序列",
          "白板繪圖：用 SVG path 描述筆跡",
          "視覺效果：聚光燈、激光筆、轉場",
          "動作與旁白同步，製造沉浸感"
        ],
        narration: "第三階段是動作生成。AI 決定在什麼時候講師應該做什麼。講複雜公式時在白板推導。強調重點時用聚光燈。所有動作與旁白完全同步。",
        audioFile: "narrations/scene_006_narration.wav"
      },
      {
        id: "scene_007",
        title: "Stage 4: 音檔生成 — OmniVoice 配音",
        keyPoints: [
          "呼叫本機 OmniVoice TTS",
          "使用固定克隆聲線（我的聲音！）",
          "台灣國語風格，自然親切",
          "並行生成，每個場景 1-2 秒"
        ],
        narration: "最後一個階段是音檔生成。teach-me-cli 呼叫本機 OmniVoice，把旁白轉成 MP3。用的是預先克隆的聲音，整個課程聲音統一。這一階段大約 30 到 45 秒。",
        audioFile: "narrations/scene_007_narration.wav"
      },
      {
        id: "scene_008",
        title: "架構：LangGraph 無狀態編排",
        keyPoints: [
          "LangGraph 是流程編排框架",
          "4 個節點：init → outline → content → actions",
          "完全無狀態（stateless）",
          "適合 Serverless、雲端部署"
        ],
        narration: "在技術層面，teach-me-cli 使用 LangGraph 編排流程。像精密流水線，每個階段一個節點。完全無狀態，每次運行完全獨立。可輕鬆部署到雲端。",
        audioFile: "narrations/scene_008_narration.wav"
      },
      {
        id: "scene_009",
        title: "集成：OpenClaw 是大腦",
        keyPoints: [
          "teach-me-cli 自己不持有 API key",
          "OpenClaw 提供 LLM 模型",
          "可以在 Telegram、Feishu 中直接使用",
          "完全無縫集成"
        ],
        narration: "teach-me-cli 本身不需要 API key。它依賴 OpenClaw 作為大腦。可在 Telegram、Feishu 等任何平台使用。完全無縫。",
        audioFile: "narrations/scene_009_narration.wav"
      },
      {
        id: "scene_010",
        title: "多格式導出：選你所需",
        keyPoints: [
          "📊 PPTX — 編輯用，可用 PowerPoint 修改",
          "📄 JSON — 完整課程結構，機器可讀",
          "🌐 HTML — 互動式網頁播放器"
        ],
        narration: "生成完成後，選擇不同的導出格式。PPTX 可用 PowerPoint 編輯。JSON 包含完整結構。HTML 是網頁播放器，學生直接在瀏覽器觀看。",
        audioFile: "narrations/scene_010_narration.wav"
      },
      {
        id: "scene_011",
        title: "性能：從按鈕到課程",
        keyPoints: [
          "初始化：1-2 秒",
          "大綱生成：15-30 秒",
          "內容生成：30-60 秒",
          "動作 + 音檔：40-65 秒",
          "總計：2-3 分鐘完整課程"
        ],
        narration: "從點擊按鈕到得到完整課程，只需 2 到 3 分鐘。相比傳統手工製作要快 100 倍！",
        audioFile: "narrations/scene_011_narration.wav"
      },
      {
        id: "scene_012",
        title: "實戰：如何使用 teach-me-cli",
        keyPoints: [
          "命令行模式：npm run generate \"主題\"",
          "OpenClaw 模式：@狐狸 teach me about X",
          "支持 PDF、Markdown、純文本輸入",
          "2-3 分鐘內得到完整課程"
        ],
        narration: "實際使用非常簡單。運行 npm run generate 加主題。或在 Telegram 中說 teach me about 某個主題。2 到 3 分鐘完成。",
        audioFile: "narrations/scene_012_narration.wav"
      },
      {
        id: "scene_013",
        title: "結語：AI 教育的新時代",
        keyPoints: [
          "教育不再是稀缺資源",
          "任何人都可以成為課程設計師",
          "質量好、速度快、成本低",
          "現在就開始，教世界學習"
        ],
        narration: "我們正處於教育 AI 革命的時代。任何人現在都可在幾分鐘內創建專業課程。下一個被你的課程改變人生的學生，可能就在等待你。",
        audioFile: "narrations/scene_013_narration.wav"
      }
    ];
    
    let currentSlide = 0;
    
    function init() {
      renderSlideList();
      renderSlides();
      updateCurrentSlide();
    }
    
    function renderSlideList() {
      const list = document.getElementById('slideList');
      scenes.forEach((scene, idx) => {
        const div = document.createElement('div');
        div.className = 'slide-item';
        div.onclick = () => goToSlide(idx);
        div.innerHTML = `
          <div class="slide-item-num">第 ${idx + 1}/${scenes.length}</div>
          <div class="slide-item-title">${scene.title}</div>
        `;
        list.appendChild(div);
      });
    }
    
    function renderSlides() {
      const slidesDiv = document.getElementById('slides');
      scenes.forEach((scene, idx) => {
        const div = document.createElement('div');
        div.className = 'slide';
        div.id = `slide-${idx}`;
        
        let audioHtml = '';
        if (scene.audioFile) {
          audioHtml = `
            <div class="audio-player">
              <audio controls preload="metadata">
                <source src="${scene.audioFile}" type="audio/wav">
                你的瀏覽器不支援音檔播放
              </audio>
              <div class="audio-status">🎙️ 旁白</div>
            </div>
          `;
        }
        
        let points = '';
        if (scene.keyPoints && scene.keyPoints.length > 0) {
          points = `<ul class="slide-points">${
            scene.keyPoints.map(p => `<li>${p}</li>`).join('')
          }</ul>`;
        }
        
        let narration = '';
        if (scene.narration) {
          narration = `<div class="slide-narration">${scene.narration}</div>`;
        }
        
        div.innerHTML = `
          <h2>${scene.title}</h2>
          ${audioHtml}
          <div>
            ${points}
            ${narration}
          </div>
        `;
        slidesDiv.appendChild(div);
      });
    }
    
    function updateCurrentSlide() {
      const items = document.querySelectorAll('.slide-item');
      const slides = document.querySelectorAll('.slide');
      
      // Scroll sidebar to current
      if (items[currentSlide]) {
        items[currentSlide].scrollIntoView({ block: 'nearest' });
      }
      
      items.forEach((item, idx) => {
        item.classList.toggle('active', idx === currentSlide);
      });
      
      slides.forEach((slide, idx) => {
        slide.classList.toggle('active', idx === currentSlide);
      });
      
      const progress = ((currentSlide + 1) / scenes.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      
      document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${scenes.length}`;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === scenes.length - 1;
    }
    
    function previousSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateCurrentSlide();
      }
    }
    
    function nextSlide() {
      if (currentSlide < scenes.length - 1) {
        currentSlide++;
        updateCurrentSlide();
      }
    }
    
    function goToSlide(idx) {
      currentSlide = idx;
      updateCurrentSlide();
    }
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') previousSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });
    
    init();
  </script>
</body>
</html>
