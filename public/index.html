<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程播放器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 1300px;
      height: calc(100vh - 40px);
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
    }

    /* ── 左側幻燈片區 ── */
    .slide-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .slide-wrapper {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 0;
      overflow: hidden;
    }

    .slide {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background: white;
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #5B9BD5, #764ba2);
    }

    .slide-title {
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f0f0f0;
      line-height: 1.3;
    }

    .slide-content {
      font-size: clamp(14px, 1.6vw, 18px);
      color: #444;
      line-height: 1.9;
      flex: 1;
      overflow: hidden;
    }

    .slide-content ul { list-style: none; padding: 0; }
    .slide-content li {
      padding: 6px 0 6px 28px;
      position: relative;
    }
    .slide-content li::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5B9BD5, #764ba2);
    }

    .slide-number {
      position: absolute;
      bottom: 20px;
      right: 28px;
      font-size: 12px;
      color: #ccc;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* 底部進度導航 */
    .nav-bar {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .play-btn {
      background: linear-gradient(135deg, #5B9BD5, #764ba2);
      border: none;
      color: white;
      padding: 8px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .play-btn:hover { opacity: 0.85; transform: scale(1.02); }

    .course-progress {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-track {
      height: 5px;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #5B9BD5, #764ba2);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }

    /* ── 右側控制面板 ── */
    .panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .panel-meta {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-meta .dot {
      width: 4px; height: 4px;
      background: #5B9BD5;
      border-radius: 50%;
    }

    /* 音頻控制 */
    .audio-section {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .audio-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .audio-time {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
    }

    .audio-progress {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .audio-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #5B9BD5, #764ba2);
      border-radius: 2px;
      transition: width 0.5s linear;
    }

    audio { display: none; }

    /* 幻燈片列表 */
    .slides-list-label {
      padding: 14px 20px 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .slides-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    .slides-list::-webkit-scrollbar { width: 4px; }
    .slides-list::-webkit-scrollbar-track { background: transparent; }
    .slides-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .slide-item {
      padding: 12px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .slide-item:hover { background: rgba(255,255,255,0.06); }
    .slide-item.active {
      background: rgba(91,155,213,0.15);
      border-left-color: #5B9BD5;
    }

    .slide-item-num {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .slide-item-title {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      line-height: 1.4;
    }
    .slide-item.active .slide-item-title { color: #a8ccf0; font-weight: 600; }

    /* 載入動畫 */
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #5B9BD5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 幻燈片切換動畫 */
    .slide { transition: opacity 0.3s ease; }
    .slide.fade { opacity: 0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="slide-area">
      <div class="slide-wrapper">
        <div class="slide" id="slide">
          <div class="slide-title" id="slideTitle">
            <div class="loading"><div class="spinner"></div> 載入課程...</div>
          </div>
          <div class="slide-content" id="slideContent"></div>
          <div class="slide-number" id="slideNum"></div>
        </div>
      </div>

      <div class="nav-bar">
        <button class="nav-btn" id="prevBtn" onclick="prev()" disabled>← 上一頁</button>
        <button class="play-btn" id="playBtn" onclick="togglePlay()">▶ 播放</button>
        <button class="nav-btn" id="nextBtn" onclick="next()" disabled>下一頁 →</button>
        <div class="course-progress">
          <div class="progress-track" onclick="seekSlide(event)" title="點擊跳轉">
            <div class="progress-fill" id="courseFill" style="width:0%"></div>
          </div>
          <div class="progress-labels">
            <span id="slideLabel">0 / 0</span>
            <span id="timeLabel">0:00 / 0:00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title" id="courseTitle">課程播放器</div>
        <div class="panel-meta">
          <div class="dot"></div>
          <span id="panelStats">載入中</span>
        </div>
      </div>

      <div class="audio-section">
        <div class="audio-label">音頻進度</div>
        <div class="audio-progress">
          <div class="audio-progress-fill" id="audioProg" style="width:0%"></div>
        </div>
        <div class="audio-time">
          <span id="audioCurrentTime">0:00</span>
          <span id="audioDuration">0:00</span>
        </div>
        <audio id="audio" onended="next()" ontimeupdate="updateTime()"></audio>
      </div>

      <div class="slides-list-label">課程目錄</div>
      <div class="slides-list" id="slidesList"></div>
    </div>
  </div>

  <script>
    let slides = [];
    let narration = [];
    let idx = 0;
    let playing = false;

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    async function load() {
      try {
        const [r1, r2] = await Promise.all([fetch('./slides.json'), fetch('./narration.json')]);
        slides = await r1.json();
        narration = await r2.json();
        document.getElementById('courseTitle').textContent = narration.courseTitle || '課程播放器';
        document.getElementById('panelStats').textContent = slides.length + ' 頁幻燈片';
        document.getElementById('prevBtn').disabled = false;
        document.getElementById('nextBtn').disabled = false;
        show(0);
        renderList();
      } catch (e) {
        document.getElementById('slideTitle').innerHTML = '❌ 無法載入課程';
        document.getElementById('slideContent').textContent = e.message;
      }
    }

    function show(i) {
      if (i < 0 || i >= slides.length) return;

      const slideEl = document.getElementById('slide');
      slideEl.classList.add('fade');

      setTimeout(() => {
        idx = i;
        const s = slides[i];
        document.getElementById('slideTitle').textContent = s.title;
        document.getElementById('slideNum').textContent = (i + 1) + ' / ' + slides.length;
        document.getElementById('slideLabel').textContent = (i + 1) + ' / ' + slides.length;
        document.getElementById('courseFill').style.width = ((i + 1) / slides.length * 100) + '%';

        let html = '';
        if (s.elements?.length) {
          const lines = s.elements[0].content.split('\n').filter(l => l.trim());
          html = '<ul>' + lines.map(l => '<li>' + escapeHtml(l) + '</li>').join('') + '</ul>';
        }
        document.getElementById('slideContent').innerHTML = html;

        if (narration.slides?.[i]?.audioFile) {
          audio.src = './narration/' + narration.slides[i].audioFile;
          if (playing) audio.play();
        } else {
          audio.removeAttribute('src');
          audio.load();
        }

        renderList();
        slideEl.classList.remove('fade');
      }, 150);
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function togglePlay() {
      if (!audio.src) return;
      playing ? audio.pause() : audio.play();
    }

    function next() { if (idx + 1 < slides.length) show(idx + 1); }
    function prev() { if (idx - 1 >= 0) show(idx - 1); }

    function seekSlide(e) {
      if (!slides.length) return;
      const pct = e.offsetX / e.currentTarget.offsetWidth;
      show(Math.min(slides.length - 1, Math.floor(pct * slides.length)));
    }

    function fmt(s) {
      return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    }

    function updateTime() {
      const t = audio.currentTime, d = audio.duration || 0;
      document.getElementById('audioCurrentTime').textContent = fmt(t);
      document.getElementById('audioDuration').textContent = fmt(d);
      document.getElementById('timeLabel').textContent = fmt(t) + ' / ' + fmt(d);
      document.getElementById('audioProg').style.width = (d ? t / d * 100 : 0) + '%';
    }

    function renderList() {
      document.getElementById('slidesList').innerHTML = slides.map((s, i) =>
        `<div class="slide-item${i === idx ? ' active' : ''}" onclick="show(${i})">
          <div class="slide-item-num">第 ${i + 1} 頁</div>
          <div class="slide-item-title">${escapeHtml(s.title)}</div>
        </div>`
      ).join('');

      // 自動捲動到當前項目
      const active = document.querySelector('.slide-item.active');
      if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    audio.addEventListener('play', () => {
      playing = true;
      playBtn.textContent = '⏸ 暫停';
    });
    audio.addEventListener('pause', () => {
      playing = false;
      playBtn.textContent = '▶ 播放';
    });

    load();
  </script>
</body>
</html>
